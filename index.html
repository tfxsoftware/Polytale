<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Polytale — engine 3D de contação de histórias com estética PS1/90s" />
    <title>Polytale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #07080f;
        --panel: rgba(10, 12, 24, 0.82);
        --border: #3b4370;
        --text: #e8ecff;
        --muted: #8a93c4;
        --accent: #5ff0e0;
        --accent-2: #ffd166;
        --danger: #ff5d73;
        --font: 'VT323', ui-monospace, 'Courier New', monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
      #app { position: fixed; inset: 0; }
      .viewport { position: absolute; inset: 0; }
      .engine-canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      .ui-layer { position: absolute; inset: 0; pointer-events: none; }
      .ui-layer > * { pointer-events: auto; }

      /* ---------- Legendas ---------- */
      /* Desenhadas por src/ui/SubtitleRenderer.ts (o mesmo código do vídeo exportado). */
      .ui-layer > .dialogue-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @keyframes blink { 50% { opacity: 0; } }

      /* ---------- Opções ---------- */
      .settings-panel {
        position: absolute; top: 16px; right: 16px; width: min(320px, calc(100% - 32px)); max-height: calc(100% - 140px); overflow: auto;
        background: #0c0f22; border: 2px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 18px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .settings-panel[hidden] { display: none; }
      .settings-panel h2 { margin: 0; flex: 1; font-size: 24px; font-weight: normal; color: var(--accent-2); }
      .settings-head { display: flex; align-items: center; gap: 8px; }
      .settings-preview { width: 100%; height: 96px; background: #2a3a2a linear-gradient(180deg, #3b5d7a, #23402c); border: 2px solid var(--border); border-radius: 4px; }
      .settings-row { display: flex; align-items: center; gap: 8px; }
      .settings-row > span:first-child { flex: 1; color: var(--muted); }
      .settings-row select, .settings-row input[type='color'] { font: inherit; font-size: 16px; background: #161a33; color: var(--text); border: 2px solid var(--border); border-radius: 4px; }
      .settings-row input[type='color'] { width: 44px; height: 28px; padding: 0 2px; }
      .settings-row input[type='range'] { width: 110px; accent-color: var(--accent); }
      .settings-row input[type='checkbox'] { width: 18px; height: 18px; accent-color: var(--accent); }
      .settings-row output { min-width: 36px; text-align: right; color: var(--text); }
      .settings-row.is-disabled { opacity: 0.4; }
      .settings-footer { display: flex; gap: 8px; justify-content: flex-end; }

      /* ---------- Painel de controle ---------- */
      .control-panel {
        position: absolute; left: 16px; right: 16px; bottom: 16px;
        background: var(--panel); border: 2px solid var(--border); border-radius: 6px; padding: 8px 10px;
        backdrop-filter: blur(4px);
      }
      .cp-title { font-size: 18px; color: var(--muted); margin: 0 2px 4px; letter-spacing: 1px; text-transform: uppercase; }
      .cp-status { font-size: 18px; color: var(--accent); margin: 0 2px 6px; }
      .cp-status.is-error { color: var(--danger); }
      .cp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .cp-btn {
        font: inherit; font-size: 20px; line-height: 1; color: var(--text); background: #161a33;
        border: 2px solid var(--border); border-radius: 4px; padding: 6px 10px; cursor: pointer; min-width: 40px;
      }
      .cp-btn:hover { border-color: var(--accent); }
      .cp-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .cp-btn:disabled { opacity: 0.5; cursor: progress; }
      .cp-btn.is-primary { background: #12403c; border-color: var(--accent); }
      .cp-play.is-playing { color: var(--accent); }
      .cp-retro { color: var(--muted); }
      .cp-btn.is-muted { color: var(--danger); }
      .cp-retro.is-on { color: #10121c; background: var(--accent-2); border-color: var(--accent-2); }
      .cp-time { font-size: 20px; min-width: 128px; font-variant-numeric: tabular-nums; color: var(--muted); }
      .cp-fps { font-size: 16px; color: var(--muted); min-width: 52px; text-align: right; }
      .cp-scrub { position: relative; flex: 1 1 220px; height: 28px; display: flex; align-items: center; }
      .cp-scrub input[type='range'] { width: 100%; margin: 0; accent-color: var(--accent); background: transparent; position: relative; z-index: 1; cursor: pointer; }
      .cp-markers { position: absolute; left: 8px; right: 8px; top: 2px; bottom: 2px; pointer-events: none; }
      .cp-marker { position: absolute; top: 0; width: 2px; height: 6px; transform: translateX(-1px); }
      .cp-marker.is-dialogue { background: var(--accent-2); }
      .cp-marker.is-camera { background: var(--muted); top: auto; bottom: 0; height: 4px; }
      .cp-marker.is-interact { background: var(--accent); top: 8px; height: 6px; }

      /* ---------- Tela inicial ---------- */
      .start-screen {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 40%, rgba(20, 26, 70, 0.75), rgba(0, 0, 0, 0.92));
        border: 0; color: var(--text); font: inherit; cursor: pointer;
      }
      .start-title { font-size: clamp(40px, 9vw, 96px); letter-spacing: 4px; text-transform: uppercase; color: var(--accent-2); text-shadow: 4px 4px 0 #6b2b12, 8px 8px 0 #000; text-align: center; padding: 0 16px; }
      .start-hint { font-size: 30px; letter-spacing: 3px; animation: blink 1.1s steps(1) infinite; }

      /* ---------- Editor ---------- */
      .editor-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.65); display: flex; align-items: center; justify-content: center; padding: 16px; }
      .editor-backdrop[hidden] { display: none; }
      .editor-modal {
        width: min(1000px, 100%); height: min(86vh, 900px); display: flex; flex-direction: column; gap: 8px;
        background: #0c0f22; border: 2px solid var(--border); border-radius: 6px; padding: 12px;
      }
      .editor-header { display: flex; align-items: center; gap: 12px; }
      .editor-header h2 { margin: 0; font-size: 28px; font-weight: normal; color: var(--accent-2); }
      .editor-info { flex: 1; font-size: 18px; color: var(--muted); }
      .editor-info.is-error { color: var(--danger); }
      .editor-text {
        flex: 1; resize: none; width: 100%; background: #05060d; color: #cfe3ff; border: 2px solid var(--border); border-radius: 4px;
        padding: 10px; font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; line-height: 1.45; tab-size: 2;
      }
      .editor-text:focus { outline: none; border-color: var(--accent); }
      .editor-errors { margin: 0; padding-left: 20px; max-height: 130px; overflow: auto; color: var(--danger); font-size: 18px; }
      .editor-errors:empty { display: none; }
      .editor-footer { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

      .cp-marker.is-chapter { background: #ff7ad9; top: -2px; height: 24px; width: 2px; }
      .cp-rec { color: #ff8a8a; }
      .cp-rec.is-recording { color: #fff; background: #b3202f; border-color: #ff5d73; animation: blink 1s steps(1) infinite; }
      .editor-spacer { flex: 1; }

      /* ---------- Cartela de capítulo ---------- */
      .title-card {
        position: absolute; left: 0; right: 0; top: 36%; height: 26%; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        background: rgba(0, 0, 0, 0.45);
      }
      .title-card-sub { font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: #c9d1ff; }
      .title-card-main { font-size: clamp(36px, 7vw, 64px); color: var(--accent-2); text-shadow: 3px 3px 0 #000; text-align: center; padding: 0 16px; }

      /* ---------- Gerador IA ---------- */
      .generator-modal { height: min(80vh, 720px); }
      .generator-hint { margin: 0; color: var(--muted); font-size: 18px; }
      .generator-story { font-family: var(--font); font-size: 20px; line-height: 1.2; }
      .generator-key { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 18px; }
      .generator-key[hidden] { display: none; }
      .generator-key input[type='password'] { flex: 1 1 240px; font: inherit; font-family: ui-monospace, monospace; font-size: 14px; background: #05060d; color: var(--text); border: 2px solid var(--border); border-radius: 4px; padding: 6px 8px; }
      .generator-key small { flex-basis: 100%; color: var(--muted); font-size: 15px; }
      .generator-status { min-height: 22px; font-size: 18px; color: var(--accent); }

      /* ---------- Trilhas ---------- */
      .tl-view {
        position: absolute; left: 16px; right: 16px; bottom: 112px; height: min(300px, 42vh);
        display: flex; flex-direction: column; background: rgba(8, 10, 22, 0.95); border: 2px solid var(--border); border-radius: 6px;
        outline: none;
      }
      .tl-view[hidden] { display: none; }
      .tl-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex-wrap: wrap; font-size: 18px; }
      .tl-bar select { font: inherit; font-size: 16px; background: #161a33; color: var(--text); border: 2px solid var(--border); border-radius: 4px; padding: 2px 4px; }
      .tl-bar input[type='range'] { width: 110px; accent-color: var(--accent); }
      .tl-status { flex: 1; min-width: 120px; color: var(--accent); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tl-status.is-error { color: var(--danger); }
      .tl-body { flex: 1; display: grid; grid-template-columns: 110px 1fr 260px; min-height: 0; }
      .tl-labels { padding-top: 22px; overflow: hidden; border-right: 1px solid var(--border); }
      .tl-label { height: 30px; line-height: 30px; padding: 0 6px; font-size: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tl-scroller { position: relative; overflow: auto; }
      .tl-ruler { position: sticky; top: 0; height: 22px; background: #0c0f22; border-bottom: 1px solid var(--border); cursor: pointer; z-index: 2; }
      .tl-tick { position: absolute; top: 0; height: 22px; border-left: 1px solid #2a3060; padding-left: 3px; font-size: 14px; color: var(--muted); }
      .tl-lanes { position: relative; }
      .tl-row { position: absolute; left: 0; height: 30px; border-bottom: 1px solid #1a1f3d; }
      .tl-block {
        position: absolute; height: 24px; line-height: 22px; padding: 0 5px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 3px; cursor: grab; color: #0b0d1a; touch-action: none; user-select: none;
      }
      .tl-block:active { cursor: grabbing; }
      .tl-block.is-selected { outline: 2px solid #fff; z-index: 1; }
      .tl-block.cat-camera { background: #8a93c4; }
      .tl-block.cat-dialogue { background: #ffd166; }
      .tl-block.cat-body { background: #5ff0e0; }
      .tl-block.cat-object { background: #9be37a; }
      .tl-block.cat-fx { background: #ff9ad5; }
      .tl-block.cat-sound { background: #c9a2ff; }
      .tl-block.cat-light { background: #ffb36a; }
      .tl-playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff5d73; pointer-events: none; z-index: 3; }
      .tl-inspector { display: flex; flex-direction: column; gap: 6px; padding: 6px; border-left: 1px solid var(--border); min-height: 0; }
      .tl-insp-title { font-size: 16px; color: var(--accent-2); }
      .tl-inspector .editor-text { font-size: 12px; }

      @media (max-width: 640px) {
        .tl-body { grid-template-columns: 80px 1fr; }
        .tl-inspector { display: none; }
        .dialogue-layer { bottom: 150px; }
        .dialogue-text { font-size: 22px; }
        .cp-time { min-width: 0; }
        .cp-fps { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
