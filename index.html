<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Polytale — engine 3D de contação de histórias com estética PS1/90s" />
    <title>Polytale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #07080f;
        --panel: rgba(10, 12, 24, 0.82);
        --border: #3b4370;
        --text: #e8ecff;
        --muted: #8a93c4;
        --accent: #5ff0e0;
        --accent-2: #ffd166;
        --danger: #ff5d73;
        --font: 'VT323', ui-monospace, 'Courier New', monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
      #app { position: fixed; inset: 0; }
      .viewport { position: absolute; inset: 0; }
      .engine-canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      .ui-layer { position: absolute; inset: 0; pointer-events: none; }
      .ui-layer > * { pointer-events: auto; }

      /* ---------- Legendas ---------- */
      .dialogue-layer {
        position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
        width: min(880px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none;
      }
      .dialogue-box {
        background: linear-gradient(180deg, rgba(18, 22, 60, 0.92), rgba(8, 10, 30, 0.92));
        border: 3px solid #c9d1ff; box-shadow: 0 0 0 3px #1a1f45, 6px 6px 0 rgba(0, 0, 0, 0.5);
        padding: 10px 16px 12px; border-radius: 4px;
      }
      .dialogue-name { font-size: 24px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; text-shadow: 2px 2px 0 #000; }
      .dialogue-text { font-size: 28px; line-height: 1.15; text-shadow: 2px 2px 0 #000; }
      .dialogue-hidden { visibility: hidden; }
      .dialogue-caret { display: inline-block; margin-left: 8px; font-size: 18px; color: var(--accent-2); animation: blink 0.8s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* ---------- Painel de controle ---------- */
      .control-panel {
        position: absolute; left: 16px; right: 16px; bottom: 16px;
        background: var(--panel); border: 2px solid var(--border); border-radius: 6px; padding: 8px 10px;
        backdrop-filter: blur(4px);
      }
      .cp-title { font-size: 18px; color: var(--muted); margin: 0 2px 4px; letter-spacing: 1px; text-transform: uppercase; }
      .cp-status { font-size: 18px; color: var(--accent); margin: 0 2px 6px; }
      .cp-status.is-error { color: var(--danger); }
      .cp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .cp-btn {
        font: inherit; font-size: 20px; line-height: 1; color: var(--text); background: #161a33;
        border: 2px solid var(--border); border-radius: 4px; padding: 6px 10px; cursor: pointer; min-width: 40px;
      }
      .cp-btn:hover { border-color: var(--accent); }
      .cp-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .cp-btn:disabled { opacity: 0.5; cursor: progress; }
      .cp-btn.is-primary { background: #12403c; border-color: var(--accent); }
      .cp-play.is-playing { color: var(--accent); }
      .cp-retro { color: var(--muted); }
      .cp-btn.is-muted { color: var(--danger); }
      .cp-retro.is-on { color: #10121c; background: var(--accent-2); border-color: var(--accent-2); }
      .cp-time { font-size: 20px; min-width: 128px; font-variant-numeric: tabular-nums; color: var(--muted); }
      .cp-fps { font-size: 16px; color: var(--muted); min-width: 52px; text-align: right; }
      .cp-scrub { position: relative; flex: 1 1 220px; height: 28px; display: flex; align-items: center; }
      .cp-scrub input[type='range'] { width: 100%; margin: 0; accent-color: var(--accent); background: transparent; position: relative; z-index: 1; cursor: pointer; }
      .cp-markers { position: absolute; left: 8px; right: 8px; top: 2px; bottom: 2px; pointer-events: none; }
      .cp-marker { position: absolute; top: 0; width: 2px; height: 6px; transform: translateX(-1px); }
      .cp-marker.is-dialogue { background: var(--accent-2); }
      .cp-marker.is-camera { background: var(--muted); top: auto; bottom: 0; height: 4px; }
      .cp-marker.is-interact { background: var(--accent); top: 8px; height: 6px; }

      /* ---------- Tela inicial ---------- */
      .start-screen {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 40%, rgba(20, 26, 70, 0.75), rgba(0, 0, 0, 0.92));
        border: 0; color: var(--text); font: inherit; cursor: pointer;
      }
      .start-title { font-size: clamp(40px, 9vw, 96px); letter-spacing: 4px; text-transform: uppercase; color: var(--accent-2); text-shadow: 4px 4px 0 #6b2b12, 8px 8px 0 #000; text-align: center; padding: 0 16px; }
      .start-hint { font-size: 30px; letter-spacing: 3px; animation: blink 1.1s steps(1) infinite; }

      /* ---------- Editor ---------- */
      .editor-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.65); display: flex; align-items: center; justify-content: center; padding: 16px; }
      .editor-backdrop[hidden] { display: none; }
      .editor-modal {
        width: min(1000px, 100%); height: min(86vh, 900px); display: flex; flex-direction: column; gap: 8px;
        background: #0c0f22; border: 2px solid var(--border); border-radius: 6px; padding: 12px;
      }
      .editor-header { display: flex; align-items: center; gap: 12px; }
      .editor-header h2 { margin: 0; font-size: 28px; font-weight: normal; color: var(--accent-2); }
      .editor-info { flex: 1; font-size: 18px; color: var(--muted); }
      .editor-info.is-error { color: var(--danger); }
      .editor-text {
        flex: 1; resize: none; width: 100%; background: #05060d; color: #cfe3ff; border: 2px solid var(--border); border-radius: 4px;
        padding: 10px; font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 13px; line-height: 1.45; tab-size: 2;
      }
      .editor-text:focus { outline: none; border-color: var(--accent); }
      .editor-errors { margin: 0; padding-left: 20px; max-height: 130px; overflow: auto; color: var(--danger); font-size: 18px; }
      .editor-errors:empty { display: none; }
      .editor-footer { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

      @media (max-width: 640px) {
        .dialogue-layer { bottom: 150px; }
        .dialogue-text { font-size: 22px; }
        .cp-time { min-width: 0; }
        .cp-fps { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
